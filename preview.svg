      <circle cx="26" cy="27" r="7" fill="#E0A63C"/>
      <text x="44" y="33" fill="#E0A63C" font-family="system-ui, sans-serif" font-size="14" font-weight="750">WARNING</text>
      <text x="20" y="70" fill="#F2EDE4" font-family="system-ui, sans-serif" font-size="20" font-weight="750">Amber</text>
      <text x="20" y="93" fill="#C8C2B6" font-family="system-ui, sans-serif" font-size="12">#E0A63C</text>
    </g>
    <g transform="translate(728 397)">
      <rect width="160" height="112" rx="12" fill="#331210" stroke="#E5564E" stroke-opacity=".45"/>
      <circle cx="26" cy="27" r="7" fill="#E5564E"/>
      <text x="44" y="33" fill="#E5564E" font-family="system-ui, sans-serif" font-size="14" font-weight="750">DANGER</text>
      <text x="20" y="70" fill="#F2EDE4" font-family="system-ui, sans-serif" font-size="20" font-weight="750">Punch</text>
      <text x="20" y="93" fill="#C8C2B6" font-family="system-ui, sans-serif" font-size="12">#E5564E</text>
    </g>
    <g transform="translate(906 397)">
      <rect width="176" height="112" rx="12" fill="#0E1A28" stroke="#6B9FD0" stroke-opacity=".45"/>
      <circle cx="26" cy="27" r="7" fill="#6B9FD0"/>
      <text x="44" y="33" fill="#6B9FD0" font-family="system-ui, sans-serif" font-size="14" font-weight="750">INFO</text>
      <text x="20" y="70" fill="#F2EDE4" font-family="system-ui, sans-serif" font-size="20" font-weight="750">Slate</text>
      <text x="20" y="93" fill="#C8C2B6" font-family="system-ui, sans-serif" font-size="12">#6B9FD0</text>
