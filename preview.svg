<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Copper for KiroCrew theme preview</title>
  <desc id="description">A near-black KiroCrew interface with copper chrome and green, gold, red, and blue status colors.</desc>
  <defs>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E09058"/>
      <stop offset="1" stop-color="#A84A1A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#080808"/>
  <circle cx="1040" cy="70" r="260" fill="#D06A32" opacity=".08"/>
  <circle cx="1040" cy="70" r="160" fill="#D06A32" opacity=".08"/>
  <g filter="url(#shadow)">
    <rect x="70" y="60" width="1060" height="510" rx="22" fill="#0C0C0C" stroke="#333333"/>
    <rect x="70" y="60" width="1060" height="58" rx="22" fill="#0A0A0A"/>
    <rect x="70" y="96" width="1060" height="22" fill="#0A0A0A"/>
    <circle cx="106" cy="89" r="7" fill="#E5564E"/>
    <circle cx="130" cy="89" r="7" fill="#E0A63C"/>
    <circle cx="154" cy="89" r="7" fill="#7FE04A"/>
    <text x="190" y="96" fill="#F2EDE4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">◎ Copper</text>

    <rect x="70" y="118" width="255" height="452" fill="#0A0A0A"/>
    <text x="102" y="166" fill="#9A9488" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="2">SESSIONS</text>
    <rect x="90" y="187" width="215" height="70" rx="10" fill="#161616" stroke="#D06A32"/>
    <rect x="90" y="187" width="4" height="70" rx="2" fill="#D06A32"/>
    <circle cx="114" cy="217" r="5" fill="#7FE04A"/>
    <text x="129" y="222" fill="#F2EDE4" font-family="system-ui, sans-serif" font-size="15" font-weight="650">Copper theme</text>
    <text x="114" y="244" fill="#C8C2B6" font-family="system-ui, sans-serif" font-size="12">Active now</text>
    <rect x="90" y="270" width="215" height="56" rx="10" fill="#101010"/>
    <circle cx="114" cy="298" r="5" fill="#6B9FD0"/>
    <text x="129" y="303" fill="#C8C2B6" font-family="system-ui, sans-serif" font-size="14">Theme validation</text>
    <rect x="90" y="339" width="215" height="56" rx="10" fill="#101010"/>
    <circle cx="114" cy="367" r="5" fill="#E0A63C"/>
    <text x="129" y="372" fill="#C8C2B6" font-family="system-ui, sans-serif" font-size="14">Install preview</text>

    <text x="372" y="166" fill="#F2EDE4" font-family="system-ui, sans-serif" font-size="28" font-weight="750">Black field. Copper chrome.</text>
    <text x="372" y="196" fill="#C8C2B6" font-family="system-ui, sans-serif" font-size="15">A focused palette with distinct semantic state.</text>

    <rect x="372" y="232" width="710" height="132" rx="14" fill="#101010" stroke="#222222"/>
    <text x="398" y="265" fill="#E09058" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">THEME STATUS</text>
    <text x="398" y="302" fill="#F2EDE4" font-family="system-ui, sans-serif" font-size="21" font-weight="700">Copper is ready to install</text>
    <text x="398" y="331" fill="#C8C2B6" font-family="system-ui, sans-serif" font-size="14">54 variables · dark and light · colors only</text>
    <rect x="882" y="274" width="170" height="48" rx="9" fill="url(#copper)"/>
    <text x="967" y="304" text-anchor="middle" fill="#1A0C06" font-family="system-ui, sans-serif" font-size="15" font-weight="800">INSTALL THEME</text>

    <g transform="translate(372 397)">
      <rect width="160" height="112" rx="12" fill="#132009" stroke="#7FE04A" stroke-opacity=".45"/>
      <circle cx="26" cy="27" r="7" fill="#7FE04A"/>
      <text x="44" y="33" fill="#7FE04A" font-family="system-ui, sans-serif" font-size="14" font-weight="750">SUCCESS</text>
      <text x="20" y="70" fill="#F2EDE4" font-family="system-ui, sans-serif" font-size="20" font-weight="750">Zombie</text>
      <text x="20" y="93" fill="#C8C2B6" font-family="system-ui, sans-serif" font-size="12">#7FE04A</text>
    </g>
    <g transform="translate(550 397)">
